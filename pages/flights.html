<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزات الطيران</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            
            background: #f3f3f3;
            margin: 0;
            padding: 0;
            
        }

        header {
            background: #1e88e5;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 22px;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin: 0;
            color: #1e88e5;
        }

        .card p {
            margin: 5px 0;
            color: #444;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        .btn {
            background: #1e88e5;
            color: white;
            padding: 10px 15px;
            border: none;
            margin-top: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">⬅ الرجوع للرئيسية</a>

<header>✈️ حجوزات الطيران</header>

<div class="container">

    <div class="card">
        <h3>خط الخرطوم → الرياض</h3>
        <p>شركة: الخطوط السعودية</p>
        <p class="price">السعر: 250$</p>
        <button class="btn">احجز الآن</button>
    </div>

    <div class="card">
        <h3>خط الخرطوم → القاهرة</h3>
        <p>شركة: مصر للطيران</p>
        <p class="price">السعر: 180$</p>
        <button class="btn">احجز الآن</button>
    </div>

    <div class="card">
        <h3>خط جدة → دبي</h3>
        <p>شركة: طيران الإمارات</p>
        <p class="price">السعر: 320$</p>
        <button class="btn">احجز الآن</button>
    </div>

</div>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
</script>
</body>
</html>
