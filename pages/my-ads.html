<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلاناتي</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .box{
            max-width:900px;
            margin:25px auto;
            background:#fff;
            padding:20px;
            border-radius:14px;
            box-shadow:var(--shadow);
        }
        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:25px;
        }
        .top h2{
            margin:0;
            color:var(--primary);
        }
        .add-btn{
            padding:10px 14px;
            background:var(--primary);
            color:#fff;
            border:none;
            border-radius:10px;
            font-weight:bold;
            cursor:pointer;
        }
        .ad{
            display:flex;
            gap:12px;
            background:#fafafa;
            padding:12px;
            border-radius:10px;
            margin-bottom:12px;
        }
        .ad img{
            width:120px;
            height:90px;
            border-radius:10px;
            object-fit:cover;
        }
        .info{
            flex:1;
        }
        .btns{
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .btn-sm{
            padding:7px;
            border-radius:8px;
            font-size:14px;
            cursor:pointer;
            border:none;
        }
        .edit{background:#007bff;color:#fff}
        .delete{background:#d9534f;color:#fff}
        .limit-box{
            background:#ffe6e6;
            padding:10px;
            border-radius:10px;
            text-align:center;
            margin-bottom:12px;
            color:#b30000;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="box">

    <div class="top">
        <h2>إعلاناتي</h2>
        <button class="add-btn" onclick="addNew()">➕ إضافة إعلان جديد</button>
    </div>

    <div id="limitBox" class="limit-box" style="display:none;"></div>

    <div id="adsContainer"></div>

</div>


<script>

// 🔴 — نظام الحد اليومي (4 إعلانات كل 24 ساعة)
function checkDailyLimit() {
    let limitData = JSON.parse(localStorage.getItem("gm_daily_limit") || "{}");
    let today = new Date().toISOString().split("T")[0];

    // reset daily counter
    if (limitData.date !== today) {
        limitData = { date: today, count: 0 };
        localStorage.setItem("gm_daily_limit", JSON.stringify(limitData));
    }

    // show limit message
    if (limitData.count >= 4) {
        document.getElementById("limitBox").style.display = "block";
        document.getElementById("limitBox").innerText =
            "❌ وصلت الحد اليومي: مسموح فقط 4 منشورات كل 24 ساعة";
        return false;
    }

    return true;
}

// فتح صفحة إضافة إعلان
function addNew() {
    if (!checkDailyLimit()) return;
    window.location.href = "new-ad.html";
}

// تحميل الإعلانات
function loadAds() {
    let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
    let container = document.getElementById("adsContainer");
    container.innerHTML = "";

    if (ads.length === 0) {
        container.innerHTML = `<p class="empty-box">لا توجد إعلانات بعد.</p>`;
        return;
    }

    ads.forEach(ad => {
        container.innerHTML += `
            <div class="ad">
                <img src="${ad.img}">
                <div class="info">
                    <h3>${ad.title}</h3>
                    <p>${ad.country} — ${ad.category}</p>
                </div>
                <div class="btns">
                    <button class="btn-sm edit" onclick="editAd(${ad.id})">تعديل</button>
                    <button class="btn-sm delete" onclick="deleteAd(${ad.id})">حذف</button>
                </div>
            </div>
        `;
    });
}

// حذف إعلان
function deleteAd(id) {
    if (!confirm("هل تريد حذف هذا الإعلان؟")) return;

    let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
    ads = ads.filter(a => a.id !== id);
    localStorage.setItem("gm_ads", JSON.stringify(ads));

    loadAds();
}

// تعديل إعلان
function editAd(id) {
    localStorage.setItem("gm_editing_id", id);
    window.location.href = "edit-ad.html";
}

// عند فتح الصفحة
loadAds();
checkDailyLimit();

</script>

</body>
</html>
