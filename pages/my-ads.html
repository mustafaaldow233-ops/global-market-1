<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلاناتي</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .box{
            max-width:1000px;
            margin:30px auto;
            padding:10px;
        }
        h2{
            text-align:center;
            margin-bottom:25px;
            color:var(--primary);
        }
        .ad-card{
            background:#fff;
            padding:18px;
            margin-bottom:15px;
            border-radius:14px;
            box-shadow:var(--shadow);
            display:flex;
            gap:15px;
        }
        .ad-card img{
            width:140px;
            height:140px;
            object-fit:cover;
            border-radius:12px;
            background:#eee;
        }
        .info{
            flex:1;
        }
        .info h3{
            margin:0;
            color:#111;
            margin-bottom:8px;
        }
        .info p{
            margin:5px 0;
            color:#555;
        }
        .actions{
            display:flex;
            flex-direction:column;
            gap:10px;
        }
        button{
            padding:8px 10px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
        }
        .delete-btn{background:#e63946;color:#fff}
        .edit-btn{background:#0077b6;color:#fff}
        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#555;
            text-decoration:none;
        }
        .empty{
            text-align:center;
            padding:40px;
            background:#fff;
            border-radius:14px;
            box-shadow:var(--shadow);
            color:#777;
            margin-top:30px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>إعلاناتي</h2>

    <div id="adsContainer"></div>

    <a href="merchant-dashboard.html" class="back">رجوع إلى لوحة التحكم</a>
</div>

<script>
function loadAds(){
    let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
    let container = document.getElementById("adsContainer");

    if(ads.length === 0){
        container.innerHTML = `<div class="empty">لا توجد إعلانات بعد</div>`;
        return;
    }

    container.innerHTML = "";

    ads.forEach(ad => {
        let card = document.createElement("div");
        card.className = "ad-card";

        card.innerHTML = `
            <img src="${ad.image || '../logo/logo.png'}" alt="">
            <div class="info">
                <h3>${ad.title}</h3>
                <p><b>التصنيف:</b> ${ad.category}</p>
                <p><b>الدولة:</b> ${ad.country}</p>
                <p><b>الوصف:</b> ${ad.description}</p>
                <p><b>الهاتف:</b> ${ad.phone}</p>
                <p><b>التاريخ:</b> ${ad.date}</p>
            </div>

            <div class="actions">
                <button class="delete-btn" onclick="deleteAd(${ad.id})">حذف</button>
            </div>
        `;

        container.appendChild(card);
    });
}

function deleteAd(id){
    let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
    let filtered = ads.filter(ad => ad.id !== id);

    localStorage.setItem("gm_ads", JSON.stringify(filtered));
    loadAds();
}

loadAds();
</script>

</body>
</html>
