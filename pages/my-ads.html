<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلاناتي</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .container-box {
            max-width: 950px;
            margin: 25px auto;
            padding: 10px;
        }

        .ad-card {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .ad-card img {
            width: 140px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
        }

        .ad-info {
            flex: 1;
        }

        .ad-info h3 {
            margin: 0;
            font-size: 18px;
            color: var(--primary);
        }

        .meta {
            color: #777;
            font-size: 13px;
            margin: 5px 0;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .edit-btn,
        .delete-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .edit-btn {
            background: #0a84ff;
            color: #fff;
        }

        .delete-btn {
            background: #e62e2e;
            color: #fff;
        }

        .empty-box {
            margin-top: 40px;
            padding: 25px;
            border-radius: 14px;
            background: #fff;
            text-align: center;
            color: #999;
            box-shadow: var(--shadow);
        }
    </style>
</head>

<body>

    <div class="container-box">

        <h2 style="color:var(--primary);text-align:center">إعلاناتي</h2>

        <div id="adsContainer"></div>

    </div>

    <script>
        function loadMyAds() {
            let user = localStorage.getItem("gm_user");
            let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");

            // فقط إعلانات المستخدم
            let myAds = ads.filter(a => a.user === user);

            const container = document.getElementById("adsContainer");
            container.innerHTML = "";

            if (myAds.length === 0) {
                container.innerHTML = `
                <div class="empty-box">
                    لا توجد إعلانات لك حتى الآن.
                </div>`;
                return;
            }

            myAds.forEach(ad => {
                container.innerHTML += `
                <div class="ad-card">
                    <img src="${ad.img}" alt="">
                    <div class="ad-info">
                        <h3>${ad.title}</h3>
                        <div class="meta">
                            ${ad.country} • ${ad.category} • ${ad.date}
                        </div>
                        <p>${ad.details.substring(0, 80)}...</p>

                        <div class="btns">
                            <button class="edit-btn" onclick="editAd(${ad.id})">تعديل</button>
                            <button class="delete-btn" onclick="deleteAd(${ad.id})">حذف</button>
                        </div>
                    </div>
                </div>
                `;
            });
        }

        function editAd(id) {
            localStorage.setItem("edit_id", id);
            window.location.href = "edit-ad.html";
        }

        function deleteAd(id) {
            if (!confirm("هل تريد حذف الإعلان؟")) return;

            let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
            let newAds = ads.filter(a => a.id !== id);

            localStorage.setItem("gm_ads", JSON.stringify(newAds));

            loadMyAds();
        }

        loadMyAds();
    </script>

</body>

    </html>
