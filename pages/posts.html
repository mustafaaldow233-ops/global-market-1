<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>كل الإعلانات</title>

<style>
body{background:#f5f5f5;font-family:tahoma;}
.top{padding:15px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;}
.card{background:#fff;padding:15px;margin:12px;border-radius:10px;border:1px solid #ddd;}
.btn{padding:8px 14px;background:#0066ff;color:#fff;border-radius:8px;text-decoration:none;margin-right:10px;}
</style>
</head>

<body>

<div class="top">
<h3>الإعلانات</h3>
<a class="btn" href="add-post.html">+ إعلان جديد</a>
</div>

<div id="list"></div>

<script>
function loadPosts(){
    let posts = JSON.parse(localStorage.getItem("posts") || "[]");
    let box = "";

    posts.forEach((p,i)=>{
        box += `
        <div class="card">
            <h3>${p.title}</h3>
            <p>${p.text}</p>
            <a class="btn" href="post.html?id=${i}">عرض</a>
        </div>`;
    });

    document.getElementById("list").innerHTML = box || "<p style='text-align:center'>لا توجد إعلانات</p>";
}

loadPosts();
</script>

</body>
</html>
