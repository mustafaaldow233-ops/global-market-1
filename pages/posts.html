<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>المنشورات</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <div class="container">

        <h2 class="page-title">جميع المنشورات</h2>

        <a href="add-post.html" class="add-btn">➕ إضافة منشور</a>

        <div id="postsList" class="posts-grid">
            <!-- يتم تحميل المنشورات من posts.js -->
        </div>

    </div>

    <script src="../scripts/posts.js"></script>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
</script>
</body>
</html>
