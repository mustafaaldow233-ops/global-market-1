<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قسم الموبايلات | Global Market</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2196f3;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .item img {
            width: 100%;
            border-radius: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px;
        }

        .price {
            color: #0b8a26;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .btn {
            display: block;
            background: #2196f3;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">⬅ الرجوع للرئيسية</a>

<header>قسم الموبايلات</header>

<div class="container">

    <div class="item">
        <img src="https://i.imgur.com/mxHPu4l.jpeg" alt="Phone 1">
        <div class="title">iPhone 13 Pro Max</div>
        <div class="price">السعر: 750$</div>
        <div>الحالة: جديد</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="item">
        <img src="https://i.imgur.com/lQMY2cB.jpeg" alt="Phone 2">
        <div class="title">Samsung S22 Ultra</div>
        <div class="price">السعر: 680$</div>
        <div>الحالة: مستخدم - نظيف جداً</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

</div>

</body>
</html>
