<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الفنادق | Global Market</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #00897b;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .hotel {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        .hotel img {
            width: 100%;
            border-radius: 12px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .stars {
            color: #ffc107;
            margin: 5px 0;
        }

        .desc {
            margin: 5px 0;
        }

        .btn {
            display: block;
            text-decoration: none;
            background: #00897b;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">⬅ الرجوع للرئيسية</a>

<header>الفنادق</header>

<div class="container">

    <div class="hotel">
        <img src="https://i.imgur.com/gtlG1pH.jpeg" alt="Hotel 1">
        <div class="title">فندق النيل الذهبي</div>
        <div class="stars">⭐⭐⭐⭐</div>
        <div class="desc">موقع ممتاز + فطور مجاني + خدمة 24 ساعة.</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="hotel">
        <img src="https://i.imgur.com/RyMZCbc.jpeg" alt="Hotel 2">
        <div class="title">فندق الواحة</div>
        <div class="stars">⭐⭐⭐</div>
        <div class="desc">غرف مريحة وتكييف ممتاز، قريب من الأسواق.</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

</div>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
</script>
</body>
</html>
