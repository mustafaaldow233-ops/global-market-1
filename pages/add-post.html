<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة منشور</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="container">
    <h2>إضافة منشور جديد</h2>

    <form id="addPostForm" class="form-box">
        
        <label>عنوان المنشور:</label>
        <input type="text" id="title" required>

        <label>الصورة:</label>
        <input type="file" id="image" accept="image/*" required>

        <label>المحتوى:</label>
        <textarea id="content" rows="6" required></textarea>

        <button type="submit" class="submit-btn">نشر</button>
    </form>

</div>

<script src="../scripts/posts.js"></script>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
</script>
</body>
    </html>
