<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة منشور</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

<div class="container">
    <h2>إضافة منشور جديد</h2>

    <form id="addPostForm" class="form-box">
        
        <label>عنوان المنشور:</label>
        <input type="text" id="title" required>

        <label>الصورة:</label>
        <input type="file" id="image" accept="image/*" required>

        <label>المحتوى:</label>
        <textarea id="content" rows="6" required></textarea>

        <button type="submit" class="submit-btn">نشر</button>
    </form>

</div>

<script src="../scripts/posts.js"></script>
</body>
    </html>
