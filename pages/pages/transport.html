<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>شركات النقل | Global Market</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1565c0;
            padding: 15px;
            text-align: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .company {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .company img {
            width: 100%;
            border-radius: 12px;
        }

        .title {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        .desc {
            margin-top: 6px;
            color: #333;
        }

        .btn {
            display: block;
            text-decoration: none;
            margin-top: 10px;
            background: #1565c0;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>شركات النقل</header>

<div class="container">

    <div class="company">
        <img src="https://i.imgur.com/Ek6Byjq.jpeg" alt="Transport 1">
        <div class="title">شركة نقل دولية</div>
        <div class="desc">تقدم خدمات الشحن بين جميع الدول، بري، جوي وبحري.</div>
        <a href="#" class="btn">التفاصيل</a>
    </div>

    <div class="company">
        <img src="https://i.imgur.com/vDsnqAK.jpeg" alt="Transport 2">
        <div class="title">شركة شحن سريع</div>
        <div class="desc">توصيل سريع خلال 24 ساعة داخل الدولة.</div>
        <a href="#" class="btn">التفاصيل</a>
    </div>

</div>

</body>
</html>
