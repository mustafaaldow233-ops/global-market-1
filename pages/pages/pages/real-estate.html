<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قسم العقارات | Global Market</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background: #009688;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .item img {
            width: 100%;
            border-radius: 10px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0 5px;
        }

        .price {
            color: #0b8a26;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .btn {
            display: block;
            background: #009688;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>قسم العقارات</header>

<div class="container">

    <div class="item">
        <img src="https://i.imgur.com/sB6xDSV.jpeg" alt="Real Estate">
        <div class="title">شقة فاخرة للبيع</div>
        <div class="price">السعر: 85,000$</div>
        <div>الدولة: الإمارات</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="item">
        <img src="https://i.imgur.com/Tw1WGeu.jpeg" alt="Real Estate">
        <div class="title">بيت طابقين كامل التشطيب</div>
        <div class="price">السعر: 45,000$</div>
        <div>الدولة: السودان</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

</div>

</body>
</html>
