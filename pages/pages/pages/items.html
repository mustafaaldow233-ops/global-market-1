<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المنتجات | Global Market</title>
    <style>
        body {
            font-family: sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #6a1b9a;
            padding: 15px;
            text-align: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .item {
            background: #fff;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.1);
        }

        .item img {
            width: 100%;
            border-radius: 12px;
        }

        .title {
            font-size: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        .price {
            color: #0b8a26;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
        }

        .desc {
            margin-top: 6px;
            color: #444;
        }

        .btn {
            display: block;
            text-decoration: none;
            margin-top: 10px;
            background: #6a1b9a;
            color: #fff;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>جميع المنتجات</header>

<div class="container">

    <div class="item">
        <img src="https://i.imgur.com/lhtwL0y.jpeg" alt="Item 1">
        <div class="title">مواد تموينية</div>
        <div class="price">السعر: حسب الطلب</div>
        <div class="desc">سكر - زيت - دقيق - مواد غذائية مختلفة.</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="item">
        <img src="https://i.imgur.com/xX5NwJb.jpeg" alt="Item 2">
        <div class="title">منتجات إلكترونية</div>
        <div class="price">السعر: متفاوت</div>
        <div class="desc">سماعات - أجهزة - أكسسوارات متنوعة.</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="item">
        <img src="https://i.imgur.com/rILxj5K.jpeg" alt="Item 3">
        <div class="title">مستلزمات منزلية</div>
        <div class="price">السعر: حسب النوع</div>
        <div class="desc">أدوات تنظيف - أواني منزلية - مستلزمات عامة.</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

</div>

</body>
</html>
