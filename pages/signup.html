<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>

    <style>
        body{
            font-family: sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box{
            background: #fff;
            padding: 25px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }
        input{
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
        button{
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
        }
        a{
            text-decoration: none;
            display: block;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>إنشاء حساب</h2>

    <input type="text" id="name" placeholder="الاسم">
    <input type="email" id="email" placeholder="الإيميل">
    <input type="password" id="password" placeholder="كلمة السر">

    <button onclick="signup()">إنشاء</button>

    <a href="login.html">لديك حساب؟ تسجيل دخول</a>
</div>

<script>
function signup(){
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    if(name === "" || email === "" || pass === ""){
        alert("أدخل كل البيانات");
        return;
    }

    // Signup وهمي يخزن بيانات المستخدم فقط
    let user = {
        name: name,
        email: email
    };

    localStorage.setItem("loggedIn", "yes");
    localStorage.setItem("user", JSON.stringify(user));

    alert("تم إنشاء الحساب");
    window.location.href = "../index.html";
}
</script>

</body>
</html>
