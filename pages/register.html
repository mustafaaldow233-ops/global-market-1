<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            margin: 0;
            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 450px;
            margin: 60px auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #8ab4f8;
        }

        label {
            display: block;
            margin: 10px 0 5px;
            color: #8ab4f8;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #8ab4f8;
            border-radius: 6px;
            margin-bottom: 12px;
            background: #121212;
            color: #fff;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #8ab4f8;
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 17px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #a4c8ff;
        }

        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 15px;
        }

        .login-link a {
            color: #8ab4f8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>إنشاء حساب جديد</h2>

        <label>الاسم الكامل</label>
        <input type="text" placeholder="ادخل اسمك الكامل">

        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@email.com">

        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••••">

        <button>إنشاء الحساب</button>

        <div class="login-link">
            عندك حساب؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

</body>
</html>
