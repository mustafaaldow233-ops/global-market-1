<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <div class="container">

        <h2 style="text-align:center;">إنشاء حساب جديد</h2>

        <form id="registerForm" class="result-item" style="max-width:450px;margin:20px auto;">
            
            <label>الاسم الكامل</label>
            <input type="text" id="name" required class="search-input" placeholder="ادخل اسمك">

            <label>البريد الإلكتروني</label>
            <input type="email" id="email" required class="search-input" placeholder="example@gmail.com">

            <label>كلمة المرور</label>
            <input type="password" id="password" required class="search-input" placeholder="••••••••">

            <button type="submit" class="search-btn" style="width:100%;margin-top:10px;">
                إنشاء حساب
            </button>

            <p style="text-align:center;margin-top:12px;">
                لديك حساب؟ <a href="login.html" style="color:#e62e2e;">تسجيل الدخول</a>
            </p>

        </form>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", function(e){
            e.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            if(name === "" || email === "" || password === ""){
                alert("الرجاء ملء جميع الحقول");
                return;
            }

            // حفظ البيانات داخل localStorage
            let user = {
                name: name,
                email: email,
                password: password
            };

            localStorage.setItem("user", JSON.stringify(user));

            alert("تم إنشاء الحساب بنجاح!");

            // تحويل إلى صفحة تسجيل الدخول
            window.location.href = "login.html";
        });
    </script>

</body>
          </html>
