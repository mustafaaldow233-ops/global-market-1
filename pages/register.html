<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .register-box{
            max-width:450px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:14px;
            box-shadow:0 6px 20px rgba(0,0,0,0.08);
        }
        .register-box h2{
            text-align:center;
            margin-bottom:20px;
            color:var(--primary);
        }
        .register-box input{
            width:100%;
            padding:12px;
            margin-bottom:14px;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:15px;
        }
        .reg-btn{
            width:100%;
            padding:12px;
            background:var(--primary);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:17px;
            cursor:pointer;
            font-weight:bold;
        }
        .success-box{
            background:#e6ffe6;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-top:15px;
            color:#0a8a0a;
            display:none;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>تسجيل حساب جديد</h2>

    <input type="text" id="name" placeholder="الاسم الكامل">
    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button class="reg-btn" onclick="register()">تسجيل</button>

    <div id="success" class="success-box">تم إنشاء الحساب بنجاح ✔</div>
</div>

<script>
function register(){
    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value.trim();
    let msg = document.getElementById("success");

    if(name === "" || email === "" || pass === ""){
        alert("الرجاء تعبئة جميع الحقول");
        return;
    }

    // ▪ حفظ مؤقت في LocalStorage بما أن GitHub Pages لا يدعم Backend
    let user = { name:name, email:email, password:pass };
    localStorage.setItem("gm_user", JSON.stringify(user));

    msg.style.display = "block";

    setTimeout(()=>{
        window.location.href = "../index.html";
    }, 1500);
}
</script>

</body>
</html>
