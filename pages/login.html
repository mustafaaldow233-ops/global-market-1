<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>تسجيل الدخول</title>

<style>
body{background:#f5f5f5;}
.box{max-width:420px;margin:40px auto;background:#fff;padding:25px;border-radius:12px;border:1px solid #ddd;box-shadow:0 6px 14px rgba(0,0,0,0.08);}
h2{text-align:center;color:#0066ff;margin-bottom:20px;}
.in{margin-bottom:15px;display:flex;flex-direction:column;}
input{padding:10px;border-radius:8px;border:1px solid #ccc;font-size:16px;}
button{width:100%;padding:12px;border:none;background:#0066ff;color:#fff;font-size:18px;border-radius:8px;cursor:pointer;margin-top:10px;}
.link{text-align:center;margin-top:15px;}
a{color:#0066ff;}
</style>
</head>

<body>
<div class="box">
<h2>تسجيل الدخول</h2>

<div class="in">
<label>البريد الإلكتروني</label>
<input type="email" id="email">
</div>

<div class="in">
<label>كلمة المرور</label>
<input type="password" id="pass">
</div>

<button onclick="login()">دخول</button>

<div class="link">
ما عندك حساب؟ <a href="signup.html">إنشاء حساب</a>
</div>
</div>

<script>
function login(){
    let saved = JSON.parse(localStorage.getItem("user"));
    if(!saved){ alert("لا يوجد حساب — سجل حساب أولاً"); return; }

    if(email.value === saved.email && pass.value === saved.pass){
        localStorage.setItem("logged", "1");
        alert("تم تسجيل الدخول");
        location.href = "posts.html";
    } else {
        alert("خطأ في البيانات");
    }
}
</script>

</body>
</html>
