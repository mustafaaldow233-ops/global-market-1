<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <div class="container">

        <h2 style="text-align:center;">تسجيل الدخول</h2>

        <form id="loginForm" class="result-item" style="max-width:450px;margin:20px auto;">
            
            <label>البريد الإلكتروني</label>
            <input type="email" id="email" required class="search-input" placeholder="example@gmail.com">

            <label>كلمة المرور</label>
            <input type="password" id="password" required class="search-input" placeholder="••••••••">

            <button type="submit" class="search-btn" style="width:100%;margin-top:10px;">
                تسجيل الدخول
            </button>

            <p style="text-align:center;margin-top:12px;">
                ماعندك حساب؟ <a href="register.html" style="color:#e62e2e;">إنشاء حساب</a>
            </p>

        </form>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(e){
            e.preventDefault();

            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            let savedUser = JSON.parse(localStorage.getItem("user"));

            if(!savedUser){
                alert("لا يوجد حساب مسجل! قم بإنشاء حساب أولاً.");
                return;
            }

            if(email === savedUser.email && password === savedUser.password){
                alert("تم تسجيل الدخول بنجاح!");

                // حفظ الجلسة
                localStorage.setItem("loggedIn", "yes");

                // تحويل للصفحة الرئيسية
                window.location.href = "../index.html";
            } else {
                alert("البريد الإلكتروني أو كلمة المرور غير صحيحة");
            }
        });
    </script>

</body>
</html>
