<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .form-box {max-width:400px;margin:40px auto;background:#fff;padding:20px;border-radius:12px;border:1px solid #ddd;}
    input {width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;}
    button {width:100%;padding:12px;background:#0066ff;color:#fff;border:0;border-radius:10px;font-size:16px;cursor:pointer;}
  </style>
</head>
<body>

<div class="form-box">
  <h2>تسجيل الدخول</h2>
  <input type="text" placeholder="البريد أو الهاتف">
  <input type="password" placeholder="كلمة السر">
  <button onclick="login()">دخول</button>

  <p style="margin-top:10px;text-align:center;">
    ماعندك حساب؟ <a href="register.html">إنشاء حساب</a>
  </p>
</div>

<script>
function login() {
  alert("تم تسجيل الدخول ✔");
  localStorage.setItem("logged", "1");
  location.href = "../index.html";
}
</script>

</body>
</html>
