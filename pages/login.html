<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .login-box{
            max-width:450px;
            margin:40px auto;
            background:#fff;
            padding:25px;
            border-radius:14px;
            box-shadow:0 6px 20px rgba(0,0,0,0.08);
        }
        .login-box h2{
            text-align:center;
            margin-bottom:20px;
            color:var(--primary);
        }
        .login-box input{
            width:100%;
            padding:12px;
            margin-bottom:14px;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:15px;
        }
        .login-btn{
            width:100%;
            padding:12px;
            background:var(--primary);
            color:#fff;
            border:none;
            border-radius:10px;
            font-size:17px;
            cursor:pointer;
            font-weight:bold;
        }
        .error-box{
            background:#ffe6e6;
            padding:12px;
            border-radius:10px;
            text-align:center;
            margin-top:10px;
            color:#b10000;
            display:none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>تسجيل الدخول</h2>

    <input type="email" id="email" placeholder="البريد الإلكتروني">
    <input type="password" id="password" placeholder="كلمة المرور">

    <button class="login-btn" onclick="login()">دخول</button>

    <div id="error" class="error-box">البريد أو كلمة المرور غير صحيحة ❌</div>
</div>

<script>
function login(){
    let email = document.getElementById("email").value.trim();
    let pass = document.getElementById("password").value.trim();
    let errorBox = document.getElementById("error");

    let user = localStorage.getItem("gm_user");
    if(!user){
        errorBox.innerText = "لا يوجد حساب مسجل!";
        errorBox.style.display = "block";
        return;
    }

    user = JSON.parse(user);

    if(email === user.email && pass === user.password){
        localStorage.setItem("gm_logged_in", "true");
        window.location.href = "../index.html";
    } else {
        errorBox.style.display = "block";
    }
}
</script>

</body>
</html>
