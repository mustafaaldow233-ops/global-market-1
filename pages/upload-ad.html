<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع إعلان جديد</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .box{
            max-width:750px;
            margin:35px auto;
            background:#fff;
            padding:25px;
            border-radius:16px;
            box-shadow:0 6px 20px rgba(0,0,0,0.1);
        }
        h2{
            text-align:center;
            margin-bottom:25px;
            color:var(--primary);
        }
        label{font-weight:bold;margin-bottom:6px;display:block}
        input,select,textarea{
            width:100%;
            padding:12px;
            border-radius:12px;
            border:1px solid #ddd;
            margin-bottom:18px;
            font-size:15px;
        }
        textarea{height:120px;resize:none}
        button{
            width:100%;
            background:var(--primary);
            color:#fff;
            padding:14px;
            border-radius:12px;
            font-size:18px;
            cursor:pointer;
            border:none;
            font-weight:bold;
        }
        .back{
            display:block;
            margin-top:18px;
            text-align:center;
            font-size:15px;
            text-decoration:none;
            color:#555;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>رفع إعلان جديد</h2>

    <form id="adForm">

        <label>عنوان الإعلان</label>
        <input type="text" id="title" required>

        <label>التصنيف</label>
        <select id="category" required>
            <option value="">اختر تصنيف</option>
            <option>سيارات</option>
            <option>شاحنات</option>
            <option>فنادق</option>
            <option>شحن دولي</option>
            <option>نقل محلي</option>
            <option>رحلات</option>
            <option>وظائف</option>
            <option>أجهزة</option>
            <option>أراضي وعقارات</option>
        </select>

        <label>الدولة</label>
        <select id="country" required>
            <option value="">اختر دولة</option>
            <option>السودان</option>
            <option>السعودية</option>
            <option>الإمارات</option>
            <option>مصر</option>
            <option>قطر</option>
            <option>تركيا</option>
            <option>الهند</option>
            <option>الصين</option>
        </select>

        <label>وصف الإعلان</label>
        <textarea id="description" required></textarea>

        <label>رقم الهاتف</label>
        <input type="text" id="phone" required>

        <label>صورة (رابط URL)</label>
        <input type="url" id="image" placeholder="https://example.com/photo.jpg">

        <button type="submit">نشر الإعلان</button>
    </form>

    <a href="merchant-dashboard.html" class="back">رجوع إلى لوحة التاجر</a>
</div>

<script>
document.getElementById("adForm").addEventListener("submit", function(e){
    e.preventDefault();

    let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");

    let newAd = {
        id: Date.now(),
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        country: document.getElementById("country").value,
        description: document.getElementById("description").value,
        phone: document.getElementById("phone").value,
        image: document.getElementById("image").value || "",
        date: new Date().toLocaleDateString()
    };

    ads.push(newAd);
    localStorage.setItem("gm_ads", JSON.stringify(ads));

    alert("تم نشر الإعلان بنجاح");
    window.location.href = "merchant-dashboard.html";
});
</script>

</body>
          </html>
