<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الإعلان</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .box {
            max-width: 900px;
            margin: 25px auto;
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .img-big {
            width: 100%;
            height: 270px;
            border-radius: 14px;
            object-fit: cover;
            margin-bottom: 18px;
        }

        .info h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .meta {
            color: #777;
            margin-bottom: 16px;
        }

        .details-box {
            background: #fafafa;
            padding: 14px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .edit-btn {
            background: #007bff;
            color: #fff;
        }

        .delete-btn {
            background: #d92b2b;
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="box">

        <img id="adImg" class="img-big" src="">

        <div class="info">
            <h2 id="adTitle"></h2>
            <div class="meta">
                <span id="adCountry"></span> •
                <span id="adCategory"></span> •
                <span id="adDate"></span>
            </div>
        </div>

        <div class="details-box">
            <h3>تفاصيل الإعلان</h3>
            <p id="adDetails"></p>
        </div>

        <div class="actions">
            <button class="edit-btn" onclick="editAd()">✏ تعديل</button>
            <button class="delete-btn" onclick="deleteAd()">🗑 حذف</button>
        </div>

    </div>

    <script>
        let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
        let singleID = Number(localStorage.getItem("gm_single_id"));

        let ad = ads.find(a => a.id === singleID);

        if (!ad) {
            alert("الإعلان غير موجود!");
            window.location.href = "../index.html";
        }

        // عرض البيانات
        document.getElementById("adImg").src = ad.img;
        document.getElementById("adTitle").innerText = ad.title;
        document.getElementById("adCountry").innerText = ad.country;
        document.getElementById("adCategory").innerText = ad.category;
        document.getElementById("adDetails").innerText = ad.details;
        document.getElementById("adDate").innerText = ad.date;

        // زر التعديل
        function editAd() {
            localStorage.setItem("gm_editing_id", ad.id);
            window.location.href = "edit-ad.html";
        }

        // زر الحذف
        function deleteAd() {
            if (!confirm("هل تريد حذف الإعلان؟")) return;

            ads = ads.filter(a => a.id !== ad.id);
            localStorage.setItem("gm_ads", JSON.stringify(ads));

            alert("تم حذف الإعلان بنجاح");
            window.location.href = "my-ads.html";
        }
    </script>

</body>

</html>
