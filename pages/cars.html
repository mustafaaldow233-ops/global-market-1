<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>قسم السيارات | Global Market</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background: #e53935;
            padding: 15px;
            text-align: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .item {
            background: #fff;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.1);
        }

        .item img {
            width: 100%;
            border-radius: 12px;
        }

        .title {
            margin: 10px 0 5px;
            font-size: 20px;
            font-weight: bold;
        }

        .price {
            color: #0b8a26;
            font-size: 18px;
            font-weight: bold;
        }

        .btn {
            display: block;
            text-decoration: none;
            text-align: center;
            background: #e53935;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-button">⬅ الرجوع للرئيسية</a>

<header>قسم السيارات</header>

<div class="container">

    <div class="item">
        <img src="https://i.imgur.com/1uVtfrP.jpeg" alt="Car 1">
        <div class="title">Toyota Land Cruiser 2022</div>
        <div class="price">السعر: 92,000$</div>
        <div>الحالة: جديد</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

    <div class="item">
        <img src="https://i.imgur.com/q9P8pJk.jpeg" alt="Car 2">
        <div class="title">Hyundai Sonata 2018</div>
        <div class="price">السعر: 14,500$</div>
        <div>الحالة: مستخدم</div>
        <a href="#" class="btn">عرض التفاصيل</a>
    </div>

</div>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
        </script>
</body>
            </html>
