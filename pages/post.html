<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عرض المنشور</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

<div class="container">

    <a href="posts.html" class="back-button">← رجوع</a>

    <div id="postBox" class="single-post">
        <h2 id="postTitle">...</h2>

        <img id="postImage" style="width:100%;border-radius:12px;margin:15px 0;display:none;">

        <p id="postContent" style="font-size:17px;line-height:1.7;color:#333;"></p>

        <button id="editBtn" class="submit-btn" style="margin-top:20px;">
            تعديل المنشور
        </button>
    </div>

</div>

<script src="../scripts/posts.js"></script>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
</script>
</body>
</html>
