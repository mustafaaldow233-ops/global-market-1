<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الإعلان</title>
    <link rel="stylesheet" href="../styles.css">

    <style>
        .edit-box {
            max-width: 700px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
            color: var(--primary);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-top: 5px;
        }

        textarea {
            height: 130px;
        }

        .save-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .img-preview {
            width: 120px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            margin-top: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <div class="edit-box">
        <h2 style="text-align:center;color:var(--primary)">تعديل الإعلان</h2>

        <label>عنوان الإعلان</label>
        <input type="text" id="title">

        <label>الدولة</label>
        <select id="country"></select>

        <label>القسم</label>
        <select id="category"></select>

        <label>التفاصيل</label>
        <textarea id="details"></textarea>

        <label>الصورة</label>
        <input type="file" id="imgInput" accept="image/*">
        <img id="preview" class="img-preview">

        <button class="save-btn" onclick="saveEdit()">حفظ التعديلات</button>
    </div>

    <script>
        let editId = localStorage.getItem("edit_id");
        let ads = JSON.parse(localStorage.getItem("gm_ads") || "[]");
        let ad = ads.find(a => a.id == editId);

        if (!ad) {
            alert("الإعلان غير موجود!");
            window.location.href = "my-ads.html";
        }

        document.getElementById("title").value = ad.title;
        document.getElementById("details").value = ad.details;

        document.getElementById("preview").src = ad.img;

        const countries = JSON.parse(localStorage.getItem("gm_countries") || "[]");
        const categories = JSON.parse(localStorage.getItem("gm_categories") || "[]");

        const cSel = document.getElementById("country");
        const catSel = document.getElementById("category");

        countries.forEach(c => cSel.innerHTML += `<option>${c}</option>`);
        categories.forEach(c => catSel.innerHTML += `<option>${c}</option>`);

        cSel.value = ad.country;
        catSel.value = ad.category;

        document.getElementById("imgInput").onchange = function (e) {
            let f = e.target.files[0];
            let reader = new FileReader();
            reader.onload = () => {
                document.getElementById("preview").src = reader.result;
                ad.img = reader.result;
            };
            reader.readAsDataURL(f);
        };

        function saveEdit() {
            ad.title = document.getElementById("title").value;
            ad.details = document.getElementById("details").value;
            ad.country = cSel.value;
            ad.category = catSel.value;
            ad.date = new Date().toLocaleDateString();

            let index = ads.findIndex(x => x.id == ad.id);
            ads[index] = ad;

            localStorage.setItem("gm_ads", JSON.stringify(ads));

            alert("تم حفظ التعديلات ✔️");
            window.location.href = "my-ads.html";
        }
    </script>

</body>

    </html>
