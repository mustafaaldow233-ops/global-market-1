<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسواق والمتاجر</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
        }

        header {
            background: #009688;
            padding: 15px;
            text-align: center;
            color: white;
            font-size: 22px;
        }

        .container {
            width: 90%;
            margin: 20px auto;
        }

        .market {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 7px rgba(0,0,0,0.1);
        }

        .market h3 {
            margin: 0;
            color: #009688;
        }

        .market p {
            margin: 7px 0;
            color: #444;
        }

        .btn {
            background: #009688;
            color: white;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button">⬅ الرجوع للرئيسية</a>

<header>🛒 الأسواق والمتاجر</header>

<div class="container">

    <div class="market">
        <h3>سوق العرب — السودان</h3>
        <p>أكبر سوق لبيع الإلكترونيات والملابس.</p>
        <button class="btn">زيارة السوق</button>
    </div>

    <div class="market">
        <h3>سوق الرياض — السعودية</h3>
        <p>متاجر هواتف، ملابس، أجهزة كهربائية.</p>
        <button class="btn">زيارة السوق</button>
    </div>

    <div class="market">
        <h3>مول الإمارات — الإمارات</h3>
        <p>أشهر مركز تسوق في دبي.</p>
        <button class="btn">زيارة السوق</button>
    </div>

    <div class="market">
        <h3>سوق العتبة — مصر</h3>
        <p>أفضل مكان لشراء إكسسوارات وإلكترونيات رخيصة.</p>
        <button class="btn">زيارة السوق</button>
    </div>

</div>
<script>
    function updateUserArea(){
        let loggedIn = localStorage.getItem("loggedIn");
        let user = JSON.parse(localStorage.getItem("user"));
        let userArea = document.getElementById("userArea");

        if(loggedIn === "yes" && user){
            userArea.innerHTML = `
                <span>مرحباً، ${user.name}</span>
                <button onclick="logout()" class="search-btn" style="background:#555;">
                    تسجيل خروج
                </button>
            `;
        } else {
            userArea.innerHTML = `
                <a href="pages/login.html" class="search-btn" style="text-decoration:none;">
                    تسجيل الدخول
                </a>
            `;
        }
    }

    function logout(){
        localStorage.removeItem("loggedIn");
        alert("تم تسجيل الخروج");
        window.location.href = "index.html";
    }

    updateUserArea();
        </script>
</body>
</html>
