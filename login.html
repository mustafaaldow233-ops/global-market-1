<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - السوق العالمي</title>
    <link href="styles.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
            font-family: "Cairo", sans-serif;
            margin: 0;
            padding: 0;
        }

        .login-container {
            max-width: 380px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .input-group {
            text-align: right;
            margin-top: 15px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background: #0077ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #005fcc;
        }

        .bottom-links {
            margin-top: 15px;
            font-size: 14px;
        }

        .bottom-links a {
            color: #0077ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        <p>مرحباً بك في السوق العالمي</p>

        <form>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@email.com" required>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button class="login-btn">دخول</button>
        </form>

        <div class="bottom-links">
            <p>ما عندك حساب؟  
                <a href="signup-user.html">إنشاء حساب جديد</a>
            </p>
            <p>
                <a href="signup-merchant.html">إنشاء حساب تاجر</a>
            </p>
        </div>
    </div>

</body>
  </html>
