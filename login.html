<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول</title>
</head>

<body>

  <h2>تسجيل حساب جديد</h2>
  <input id="signupEmail" type="email" placeholder="البريد الإلكتروني"><br><br>
  <input id="signupPass" type="password" placeholder="كلمة المرور"><br><br>
  <button id="signupBtn">إنشاء حساب</button>

  <hr>

  <h2>تسجيل الدخول</h2>
  <input id="loginEmail" type="email" placeholder="البريد الإلكتروني"><br><br>
  <input id="loginPass" type="password" placeholder="كلمة المرور"><br><br>
  <button id="loginBtn">تسجيل الدخول</button>

  <!-- سكربت تسجيل الدخول + إنشاء حساب -->
  <script type="module">

    import { auth } from "./firebase.js";
    import { db } from "./firebase.js";

    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // -----------------------
    // إنشاء حساب جديد
    // -----------------------
    const signupBtn = document.getElementById("signupBtn");

    if (signupBtn) {
      signupBtn.addEventListener("click", async () => {
        const email = document.getElementById("signupEmail").value;
        const password = document.getElementById("signupPass").value;

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          // حفظ بيانات المستخدم في Firestore
          await setDoc(doc(db, "users", user.uid), {
            uid: user.uid,
            email: email,
            createdAt: new Date()
          });

          alert("تم إنشاء الحساب بنجاح!");
        } catch (err) {
          alert(err.message);
        }
      });
    }

    // -----------------------
    // تسجيل الدخول
    // -----------------------
    const loginBtn = document.getElementById("loginBtn");

    if (loginBtn) {
      loginBtn.addEventListener("click", async () => {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPass").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          alert("تم تسجيل الدخول بنجاح");

          // بعد الدخول → نرجع لصفحة الرئيسية
          window.location.href = "index.html";
        } catch (err) {
          alert(err.message);
        }
      });
    }

  </script>

</body>
</html>
