<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-box">
    <h2>تسجيل الدخول</h2>

    <form id="loginForm">
        <div class="input-field">
            <input type="text" id="email" required>
            <label>البريد الإلكتروني</label>
        </div>

        <div class="input-field">
            <input type="password" id="password" required>
            <label>كلمة المرور</label>
        </div>

        <button type="submit" class="btn">دخول</button>
    </form>

    <p class="msg" id="msg"></p>

</div>

<script>
    // Login Validation (Fake)
    document.getElementById("loginForm").addEventListener("submit", function(e){
        e.preventDefault();

        let email = document.getElementById("email").value;
        let pass  = document.getElementById("password").value;
        let msg   = document.getElementById("msg");

        if(email === "test@gmail.com" && pass === "123456"){
            msg.style.color = "green";
            msg.innerHTML = "تم تسجيل الدخول بنجاح 👌";
            setTimeout(() => {
                window.location.href = "index.html"; // بعد الدخول
            }, 1500);
        } else {
            msg.style.color = "red";
            msg.innerHTML = "البريد أو كلمة المرور غير صحيحة ❌";
        }
    });
</script>
<script type="module">
  import { auth } from "./firebase.js";
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // زر التسجيل
  const signupBtn = document.getElementById("signupBtn");
  if (signupBtn) {
    signupBtn.addEventListener("click", async () => {
      const email = document.getElementById("signupEmail").value;
      const password = document.getElementById("signupPass").value;
      try {
        await createUserWithEmailAndPassword(auth, email, password);
        alert("تم إنشاء الحساب بنجاح");
      } catch (err) {
        alert(err.message);
      }
    });
  }

  // زر تسجيل الدخول
  const loginBtn = document.getElementById("loginBtn");
  if (loginBtn) {
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPass").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("تم تسجيل الدخول بنجاح");
        window.location.href = "index.html"; // بعد تسجيل الدخول
      } catch (err) {
        alert(err.message);
      }
    });
  }
</script>
</body>
</html>
