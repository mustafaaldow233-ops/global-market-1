<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزات الفنادق</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
        }

        .back-btn {
            display: inline-block;
            margin: 15px;
            text-decoration: none;
            background: #444;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
            height: 150px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-weight: bold;
            margin: 8px 0;
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">⬅ الرجوع</a>

    <header>🏨 حجوزات الفنادق</header>

    <div class="container">

        <div class="card">
            <img src="hotel1.jpg" alt="صورة الفندق">
            <h3>فندق السلام</h3>
            <p>الموقع: الخرطوم</p>
            <p class="price">$80 لليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

        <div class="card">
            <img src="hotel2.jpg" alt="صورة الفندق">
            <h3>فندق النخيل</h3>
            <p>الموقع: الرياض</p>
            <p class="price">$120 لليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

        <div class="card">
            <img src="hotel3.jpg" alt="صورة الفندق">
            <h3>فندق الشمس</h3>
            <p>الموقع: القاهرة</p>
            <p class="price">$90 لليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

    </div>

</body>
</html>
