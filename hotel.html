<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجوزات الفنادق</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        header {
            background-color: #1a1a1a;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
        }

        .back-btn {
            display: inline-block;
            margin: 15px;
            background: #333;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 6px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }

        .price {
            color: green;
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-btn">⬅ الرجوع</a>

    <header>🏨 حجوزات الفنادق</header>

    <div class="container">

        <div class="card">
            <img src="hotel1.jpg" alt="فندق">
            <h3>فندق الهيلتون</h3>
            <p>المدينة: الخرطوم</p>
            <p class="price">$90 / الليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

        <div class="card">
            <img src="hotel2.jpg" alt="فندق">
            <h3>فندق الريتز كارلتون</h3>
            <p>المدينة: الرياض</p>
            <p class="price">$150 / الليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

        <div class="card">
            <img src="hotel3.jpg" alt="فندق">
            <h3>فندق العنوان</h3>
            <p>المدينة: دبي</p>
            <p class="price">$200 / الليلة</p>
            <button class="btn">احجز الآن</button>
        </div>

    </div>

</body>
                </html>
