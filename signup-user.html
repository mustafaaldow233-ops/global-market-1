<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - السوق العالمي</title>
    <style>
        body {
            background: #f5f7fa;
            font-family: "Cairo", sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 380px;
            margin: 60px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
        }

        .input-group {
            text-align: right;
            margin-top: 15px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #1f8a39;
        }

        .back-link {
            margin-top: 12px;
        }

        .back-link a {
            color: #0077ff;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>إنشاء حساب مستخدم</h2>
        <p>مرحباً بك في السوق العالمي</p>

        <form>

            <div class="input-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="أدخل اسمك" required>
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="example@email.com" required>
            </div>

            <div class="input-group">
                <label>الدولة</label>
                <select required>
                    <option value="">اختر الدولة</option>
                    <option>السودان</option>
                    <option>السعودية</option>
                    <option>الإمارات</option>
                    <option>مصر</option>
                    <option>تركيا</option>
                    <option>أمريكا</option>
                    <option>عالمي (أي دولة)</option>
                </select>
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button class="signup-btn">إنشاء الحساب</button>

        </form>

        <div class="back-link">
            <a href="login.html">لديك حساب؟ تسجيل الدخول</a>
        </div>
    </div>

</body>
                      </html>
