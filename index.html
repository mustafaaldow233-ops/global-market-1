<!DOCTYPE html>
<html lang="ar" dir="rtl">

<link rel="stylesheet" href="styles.css">
  <!-- Google font -->

  <style>
    :root{
      --bg: #0f1112;
      --card: #0f1314;
      --muted: #9aa4b2;
      --accent: #0066ff;
      --text: #e9eef5;
      --panel: #121212;
      --radius: 12px;
      --max-w: 1100px;
    }
    html,body{height:100%; margin:0; font-family:Inter, "Noto Naskh Arabic", Arial, sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; direction:rtl;}
    a{color:var(--accent); text-decoration:none}
    .container{max-width:var(--max-w); margin:18px auto; padding:0 16px;}
    header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px;}
    .brand{display:flex; align-items:center; gap:12px;}
    .logo{width:56px; height:56px; border-radius:10px; background:linear-gradient(135deg,var(--accent), #00bfff); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:20px;}
    .site-title{font-size:22px; font-weight:700;}
    .top-controls{display:flex; gap:12px; align-items:center;}
    .country-select, .search-wrap, .auth-wrap{background:var(--panel); padding:8px; border-radius:10px;}
    select{background:transparent; border:none; color:var(--text); font-weight:600; direction:ltr; padding:4px 8px;}
    .search-wrap{display:flex; align-items:center; gap:8px;}
    .search-wrap input{background:transparent; border:none; color:var(--text); outline:none; width:220px; padding:6px}
    .btn{background:var(--accent); color:#fff; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; font-weight:600;}
    .btn.secondary{background:#222; color:var(--text); border:1px solid #2a2a2a;}
    .layout{display:flex; gap:18px;}
    nav.aside{width:230px; background:transparent; padding:6px; border-radius:10px;}
    nav.aside ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
    nav.aside li{background:#0b0c0d; padding:12px 14px; border-radius:10px; cursor:pointer; color:#cfe6ff;}
    main{flex:1; min-height:60vh;}
    .hero{background:linear-gradient(180deg,#0c0d0e, #101317); padding:18px; border-radius:12px; margin-bottom:14px; display:flex; gap:16px; align-items:center; justify-content:space-between;}
    .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
    .card{background:var(--card); padding:12px; border-radius:12px; min-height:120px; box-shadow:0 6px 18px rgba(0,0,0,0.5);}
    footer{margin-top:28px; padding:20px; border-top:1px solid rgba(255,255,255,0.03); color:var(--muted); text-align:center;}
    /* modal */
    .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:999;}
    .modal{background:var(--panel); width:360px; max-width:95%; border-radius:12px; padding:18px;}
    .form-group input{width:100%; padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:var(--text);}
    @media (max-width:900px){
      header{flex-direction:column; align-items:flex-start; gap:12px;}
      .layout{flex-direction:column;}
      nav.aside{width:100%; display:flex; overflow:auto;}
      nav.aside ul{flex-direction:row; gap:8px;}
      nav.aside li{min-width:110px; text-align:center;}
    }
  </style>
</head>

  <!-- Firebase & app logic (واحد فقط) -->
  <script type="module">
    // --- Firebase (single, consistent version) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, onAuthStateChanged,
      signOut, GoogleAuthProvider, signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTxDtXoylZzLgUIyUkcj92ZN44voX0FA8",
      authDomain: "global-market-95a36.firebaseapp.com",
      projectId: "global-market-95a36",
      storageBucket: "global-market-95a36.firebasestorage.app",
      messagingSenderId: "967013217852",
      appId: "1:967013217852:web:b67ed2fddb5f0b7c05b539",
      measurementId: "G-B7WRYDLK6K"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DOM
    const modal = document.getElementById('modal');
    const authForm = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const passInput = document.getElementById('passInput');
    const authMsg = document.getElementById('authMsg');
    const notLogged = document.getElementById('notLogged');
    const logged = document.getElementById('logged');
    const userEmail = document.getElementById('userEmail');
    let mode = 'login';

    window.openAuth = (type) => {
      mode = type === 'signup' ? 'signup' : 'login';
      updateModal();
      modal.style.display = 'flex';
      authMsg.textContent = '';
    };
    function updateModal(){
      if(mode==='signup'){ document.getElementById('modalTitle').textContent='إنشاء حساب'; submitBtn.textContent='إنشاء الحساب'; nameGroup.style.display='block'; }
      else { document.getElementById('modalTitle').textContent='تسجيل دخول'; submitBtn.textContent='دخول'; nameGroup.style.display='none'; }
    }
    window.closeModal = ()=> modal.style.display='none';
    window.switchAuth = ()=> { mode = (mode==='signup'?'login':'signup'); updateModal(); };

    // Signup / Login
    authForm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      authMsg.textContent='';
      const email = emailInput.value.trim();
      const pass = passInput.value;
      if(!email || !pass){ authMsg.textContent='اكمل الحقول'; return; }
      try{
        if(mode==='signup'){
          const name = nameInput.value.trim();
          if(!name){ authMsg.textContent='ادخل اسمك'; return; }
          await createUserWithEmailAndPassword(auth, email, pass);
          authMsg.style.color='#6f6'; authMsg.textContent='تم إنشاء الحساب';
          closeModal();
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
          authMsg.style.color='#6f6'; authMsg.textContent='تم تسجيل الدخول';
          closeModal();
        }
      }catch(err){
        authMsg.style.color='#f66'; authMsg.textContent = err.message || 'خطأ';
        console.error(err);
      }
    });

    // Google sign
    window.signInWithGoogle = async ()=>{
      const provider = new GoogleAuthProvider();
      try{ await signInWithPopup(auth, provider); closeModal(); } catch(e){ authMsg.textContent=e.message||'خطأ Google'; }
    };

    // auth state
    onAuthStateChanged(auth, user=>{
      if(user){
        notLogged.style.display='none'; logged.style.display='block';
        userEmail.textContent = user.email || user.displayName || 'مستخدم';
      } else {
        notLogged.style.display='block'; logged.style.display='none';
      }
    });

    window.signOutUser = async ()=> { await signOut(auth); alert('تم تسجيل الخروج'); };

    // demo quick login
    window.triggerDemoLogin = function(){
      const demoEmail = 'demo' + Date.now() + '@example.com';
      const demoPass = Math.random().toString(36).slice(2,9);
      createUserWithEmailAndPassword(auth, demoEmail, demoPass)
        .then(()=> alert('تم إنشاء حساب تجريبي — ' + demoEmail))
        .catch(err=> console.log(err));
    };

    // SEARCH functionality (بحث في الإعلانات + فلترة حسب الدولة)
    document.getElementById('searchBtn').addEventListener('click', ()=>{
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const country = document.getElementById('countrySelect').value;
      // مثال بسيط: نعرض alert — استبدل هذا الجزء بمنطق فعلي (فلترة الصفحات أو استدعاء API)
      alert('بحث عن: ' + q + (country? (' — دولة: '+country) : ''));
    });

    // close modal on backdrop click
    document.getElementById('modal').addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });

    // language change (AR/EN/FR) — مثال بسيط
    document.getElementById('languageSelect').addEventListener('change', (e)=>{
      const lang = e.target.value;
      if(lang==='ar'){ document.documentElement.lang='ar'; document.documentElement.dir='rtl'; }
      else { document.documentElement.lang=lang; document.documentElement.dir='ltr'; }
      // TODO: هنا تضيف تغيير نصوص حسب اللغة (يمكنك استخدام map للترجمة)
    });
    // SORTING — ترتيب الإعلانات
const sortSelect = document.getElementById("sortSelect");
const adsGrid = document.getElementById("adsGrid");

sortSelect.addEventListener("change", () => {
  let ads = Array.from(adsGrid.children);

  const mode = sortSelect.value;

  ads.sort((a, b) => {
    let titleA = a.dataset.title.toLowerCase();
    let titleB = b.dataset.title.toLowerCase();

    let timeA = new Date(a.dataset.time);
    let timeB = new Date(b.dataset.time);

    if (mode === "az") return titleA.localeCompare(titleB);
    if (mode === "za") return titleB.localeCompare(titleA);
    if (mode === "new") return timeB - timeA;
    if (mode === "old") return timeA - timeB;

    return 0;
  });

  adsGrid.innerHTML = "";
  ads.forEach(card => adsGrid.appendChild(card));
});
  </script>
