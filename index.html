<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Market</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f2f2f2;
            direction: rtl;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background: #ffffff;
            border-bottom: 2px solid #ddd;
        }

        header img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-left: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
            color: #e60000;
        }

        /* COUNTRY SELECT */
        .country-select {
            padding: 15px;
            background: #fff;
            margin: 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        select {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #aaa;
        }

        /* SEARCH */
        .search-box {
            margin: 10px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 17px;
        }

        .search-box button {
            padding: 14px;
            background: red;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        /* CATEGORIES */
        .categories {
            padding: 10px;
        }

        .category {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 20px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #222;
            color: white;
            margin-top: 20px;
        }
    </style>

</head>

<body>

    <!-- HEADER -->
    <header>
        <img src="logo/logo.png" alt="Global Market Logo">
        <h1>Global Market</h1>
    </header>

    <!-- COUNTRY SELECT -->
    <div class="country-select">
        <select>
            <option>عالمي</option>
            <option>السودان</option>
            <option>السعودية</option>
            <option>الإمارات</option>
            <option>مصر</option>
        </select>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" placeholder="ابحث هنا...">
        <button>بحث</button>
    </div>

    <!-- CATEGORIES -->
    <div class="categories">
        <div class="category">🚗 سيارات</div>
        <div class="category">🏠 عقارات</div>
        <div class="category">📱 موبايلات</div>
        <div class="category">👗 ملابس</div>
        <div class="category">💼 وظائف</div>
        <div class="category">📦 منتجات متنوعة</div>
        <!-- قسم شركات النقل -->
<a href="transport.html" class="category-box">
    <span>شركات النقل</span>
    <span>🚚</span>
    </a>
    </div>

    <footer>
        © 2025 Global Market
    </footer>

</body>
    </html>
