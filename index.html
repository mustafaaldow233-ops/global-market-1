<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>Global Market - تسجيل دخول</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ربط التنسيق -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* تنسيقات خاصة بالصفحة فقط */
    .auth-container{
      max-width:420px;
      margin:50px auto;
      background:#fff;
      padding:25px;
      border-radius:14px;
      box-shadow:0 6px 18px rgba(0,0,0,0.08);
    }
    .auth-title{
      font-size:22px;
      font-weight:700;
      margin-bottom:20px;
      color:#e62e2e;
      text-align:center;
    }
    .auth-input{
      width:100%;
      padding:12px;
      margin:8px 0;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px;
    }
    .auth-btn{
      width:100%;
      padding:12px;
      background:#e62e2e;
      color:#fff;
      border:none;
      border-radius:10px;
      margin-top:10px;
      cursor:pointer;
      font-weight:700;
    }
    .switch-link{
      margin-top:14px;
      text-align:center;
      color:#555;
      cursor:pointer;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="auth-container" id="loginBox">
    <div class="auth-title">تسجيل دخول</div>

    <input id="loginEmail" class="auth-input" placeholder="الإيميل">
    <input id="loginPass" type="password" class="auth-input" placeholder="كلمة المرور">

    <button class="auth-btn" onclick="login()">تسجيل دخول</button>

    <div class="switch-link" onclick="showSignup()">إنشاء حساب جديد</div>
    <p id="loginMsg"></p>
  </div>

  <div class="auth-container" id="signupBox" style="display:none;">
    <div class="auth-title">إنشاء حساب جديد</div>

    <input id="signupName" class="auth-input" placeholder="الاسم الكامل">
    <input id="signupEmail" class="auth-input" placeholder="الإيميل">
    <input id="signupPass" type="password" class="auth-input" placeholder="كلمة المرور">

    <button class="auth-btn" onclick="signup()">إنشاء الحساب</button>

    <div class="switch-link" onclick="showLogin()">عندي حساب مسبقاً</div>
    <p id="signupMsg"></p>
  </div>

  <script>
    function showSignup(){
      document.getElementById("loginBox").style.display="none";
      document.getElementById("signupBox").style.display="block";
    }
    function showLogin(){
      document.getElementById("signupBox").style.display="none";
      document.getElementById("loginBox").style.display="block";
    }
  </script>

  <script src="main.js"></script>
  <!-- Firebase JS SDK -->
<script type="module">
  // استيراد وظائف Firebase من CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
  import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

  // إعدادات Firebase الخاصة بك
  const firebaseConfig = {
    apiKey: "AIzaSyDor7ySGZwwUNsBShSuc03i6jY8JUGDROI",
    authDomain: "global-market-auth.firebaseapp.com",
    projectId: "global-market-auth",
    storageBucket: "global-market-auth.firebasestorage.app",
    messagingSenderId: "435108661512",
    appId: "1:435108661512:web:41c9e6fc2564bd3c9444bd",
    measurementId: "G-59Z8FP8S3D"
  };

  // تهيئة Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // مثال: التحقق من تسجيل الدخول
  onAuthStateChanged(auth, user => {
    if (user) {
      console.log("المستخدم مسجل دخوله:", user.email);
    } else {
      console.log("لا يوجد مستخدم مسجل دخول");
    }
  });

  // مثال: تسجيل مستخدم جديد
  async function registerUser(email, password) {
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      console.log("تم تسجيل المستخدم:", userCredential.user.email);
    } catch (error) {
      console.error("خطأ أثناء التسجيل:", error.message);
    }
  }

  // مثال: تسجيل الدخول
  async function loginUser(email, password) {
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      console.log("تم تسجيل الدخول:", userCredential.user.email);
    } catch (error) {
      console.error("خطأ أثناء تسجيل الدخول:", error.message);
    }
  }

  // مثال: تسجيل الخروج
  async function logoutUser() {
    await signOut(auth);
    console.log("تم تسجيل الخروج");
  }

  // مثال: إضافة بيانات في Firestore
  async function addData(collectionName, data) {
    try {
      const docRef = await addDoc(collection(db, collectionName), data);
      console.log("تم إضافة المستند:", docRef.id);
    } catch (error) {
      console.error("خطأ أثناء الإضافة:", error.message);
    }
  }

  // مثال: قراءة بيانات من Firestore
  async function readData(collectionName) {
    const querySnapshot = await getDocs(collection(db, collectionName));
    querySnapshot.forEach(doc => {
      console.log(`${doc.id} =>`, doc.data());
    });
  }

  // هذه الدوال يمكنك استخدامها مباشرة في ملفات JS الخاصة بموقعك
</script>
</body>
</html>
