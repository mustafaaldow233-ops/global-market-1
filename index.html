<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السوق العالمي 🌍</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
        }

        header {
            background: #0d0d22;
            padding: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .search-box {
            margin: 20px auto;
            width: 90%;
            max-width: 500px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            width: 90%;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-size: 20px;
        }

        footer {
            margin: 40px 0 20px;
            color: #777;
        }
    </style>
</head>
<body>

    <header>السوق العالمي 🌍</header>

    <div class="search-box">
        <input type="text" placeholder="إبحث عن المنتجات أو الخدمات...">
    </div>

    <div class="grid">

        <div class="card">فنادق 🏨</div>
        <div class="card">طيران ✈️</div>

        <div class="card">مواد تموينية 🛒</div>
        <div class="card">سيارات 🚗</div>

        <div class="card">عالمي / محلي 🌍</div>
        <div class="card">سياحة 🌴</div>

        <!-- ✨ قسم شركات النقل الجديد -->
        <div class="card">شركات النقل 🚚</div>

    </div>

    <footer>© 2025 السوق العالمي - جميع الحقوق محفوظة</footer>

</body>
</html>
