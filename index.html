<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>السوق العالمي</title>
    <style>
        body {
            font-family: "Tahoma", sans-serif;
            margin: 0;
            background: #f4f4f4;
        }
        header {
            background: #0f1120;
            color: #fff;
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }
        .search-box {
            width: 85%;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            border: 1px solid #ccc;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 90%;
            margin: auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #444;
            font-size: 15px;
        }
    </style>
</head>
<body><header>السوق العالمي 🌍</header><input class="search-box" type="text" placeholder="ابحث عن المنتجات أو الخدمات..." /><div class="grid">
    <div class="card">فنادق 🏨</div>
    <div class="card">طيران ✈️</div>
    <div class="card">مواد تموينية 🛒</div>
    <div class="card">سيارات 🚗</div>
    <div class="card">عالمي 🌍 / محلي</div>
    <div class="card">سياحة 🌴</div>
</div><footer>© 2025 السوق العالمي - جميع الحقوق محفوظة</footer></body>
        </html>
