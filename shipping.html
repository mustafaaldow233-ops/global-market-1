<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركات النقل</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>شركات النقل</h1>
    <a href="shipping-add.html" class="add-btn">+ إضافة شركة</a>
</header>

<main>
    <div id="companyList" class="company-list"></div>
</main>

<script>
function loadCompanies() {
    let companies = JSON.parse(localStorage.getItem("shipping_companies")) || [];
    let list = document.getElementById("companyList");

    if (companies.length === 0) {
        list.innerHTML = "<p class='empty'>لا توجد شركات مسجلة</p>";
        return;
    }

    list.innerHTML = companies.map(c => `
        <div class="company-card">
            <h2>${c.name}</h2>
            <p><strong>الهاتف:</strong> ${c.phone}</p>
            <p><strong>الولاية:</strong> ${c.state}</p>
            <p><strong>الخدمة:</strong> ${c.service}</p>
            <p>${c.description}</p>
        </div>
    `).join("");
}

loadCompanies();
</script>

</body>
</html>
